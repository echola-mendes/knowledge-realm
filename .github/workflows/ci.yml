name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: knowledge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d knowledge"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements.txt

      - name: Install backend dependencies
        run: pip install -r server/requirements.txt

      - name: Prepare database
        env:
          PGPASSWORD: postgres
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          psql -h localhost -U postgres -d knowledge -c "CREATE EXTENSION IF NOT EXISTS vector;"
          python server/scripts/alembic_upgrade.py

      - name: Run pytest
        working-directory: server
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/knowledge
          REDIS_URL: redis://localhost:6379/0
          SESSION_SECRET: ci-session-secret-min-32-characters
          INITIAL_PASSWORD: ci-test-password
          LLM_API_KEY: dummy
        run: pytest -q

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Frontend typecheck and build
        working-directory: web
        run: |
          npm ci
          npm run typecheck
          npm run build

      - name: Verify Docker images build
        run: docker compose build
